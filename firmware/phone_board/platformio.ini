; PlatformIO project for the phone-companion board, rev B and rev C (same
; circuit; docs/phone_board.md). Build from the repo root with:
;   pio run -d firmware/phone_board
; The retired rev A firmware is a separate project in legacy/rev_a.
;
; Target is a bare ESP32-S3-MINI-1-N8 module: 8 MB quad flash, no PSRAM, native
; USB on GPIO19/20. esp32-s3-devkitc-1 wraps the same chip and already defaults
; to 8 MB flash with no PSRAM, so only the partition table is made explicit.
; PSRAM stays disabled -- the N8 has none, and enabling it boot-loops the S3.
;
; The platform is pinned so the Arduino core (and with it neopixelWrite() and
; the NimBLE/IDF interplay) cannot shift under us between builds.

[env:phone_board]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino

board_upload.flash_size = 8MB
board_build.flash_size = 8MB
board_build.partitions = default_8MB.csv

; Native USB CDC, as on rev A: Serial appears on the USB-C port (no UART bridge).
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Exact versions for reproducible builds. Adafruit BusIO is pulled in by the
; ADS1X15 and SHT4x libraries; it is pinned here too so it cannot float.
; The board's T/RH sensor is an SHT40 (I2C 0x44), not a BME280.
lib_deps =
    h2zero/NimBLE-Arduino@2.5.1
    adafruit/Adafruit ADS1X15@2.6.2
    adafruit/Adafruit SHT4x Library@1.0.5
    adafruit/Adafruit Unified Sensor@1.1.15
    adafruit/Adafruit BusIO@1.17.4

; The SHT4x library.properties lists the OLED demo's display libraries as
; dependencies; they are not needed here.
lib_ignore =
    Adafruit SSD1306
    Adafruit SH110X
    Adafruit GFX Library
